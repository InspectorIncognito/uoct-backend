upstream nginx_server {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    keepalive_timeout  60;

    proxy_connect_timeout 60;
    proxy_send_timeout 60;
    proxy_read_timeout 60;
    send_timeout 60;

    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Static assets: return 404 if not found (never fall back to index.html)
    # This prevents MIME type errors when a JS/CSS chunk hash changes after a new build
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|map)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing: fall back to index.html only for HTML navigation requests
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        # everything is passed to Gunicorn
        rewrite ^/api/(.*) /api/$1 break;
        proxy_pass http://nginx_server/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/backend/static/;
    }

    location /files/ {
        alias /app/backend/files/;
    }
}