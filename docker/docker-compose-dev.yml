x-dev-server: &dev-server
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: dev
  env_file:
    - ./dev/backend_env
  volumes:
    - ../backend:/app/backend

services:
  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/NginxDockerfile
      args:
        - GIT_PERSONAL_TOKEN=${GITHUB_TOKEN}
        - VUE_APP_BASE_URL=${VUE_APP_BASE_URL}
        - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
        - VITE_FORM_URL=${VITE_FORM_URL}
    profiles: ["dev"]
    ports:
      - "8080:80"
    depends_on:
      - web
    networks:
      - nginx_network
  web:
    profiles: ["dev", "test"]
    <<: *dev-server
    command: webserver-dev
    ports:
      - "8081:8000"
    depends_on:
      - db
      - cache
    networks:
      - nginx_network
      - database_network
      - cache_network
  db:
    profiles: ["dev", "test"]
    ports:
      - "5431:5432"
  worker:
    volumes:
      - ../backend:/app/backend # ← Monta el código fuente
    environment:
      - DEBUG=True
  rq-dashboard:
    profiles: ["dev", "prod"] # Disponible en dev y prod
    image: eoranged/rq-dashboard
    container_name: rq_dashboard
    ports:
      - "9181:9181"
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://cache:6379/0
    depends_on:
      - cache
    networks:
      - cache_network
